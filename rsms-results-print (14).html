<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0d1117"/>
<title>RSMS — Result Cards</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0d1117;--card:#1a2236;--card2:#1e2a45;--line:rgba(255,255,255,.08);
  --t1:#f0f6ff;--t2:#c9d6f0;--t3:#8899bb;--t4:#566280;
  --gold:#d4a843;--green:#22c55e;--red:#ef4444;--teal:#0ea5e9;
  --serif:'Fraunces',serif;--sans:'Outfit',sans-serif;--mono:'DM Mono',monospace;
  --r:14px;--r2:10px;
}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);min-height:100vh;padding:16px;}
.top-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.top-bar h1{font-family:var(--serif);font-size:1.2rem;font-weight:900;}
.top-bar a{color:var(--t3);font-size:.8rem;text-decoration:none;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.card-title{font-weight:800;font-size:.9rem;color:var(--t1);margin-bottom:12px;}
.fg{margin-bottom:10px;}
.fg label{display:block;font-size:.72rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.fi{width:100%;background:var(--card2);border:1.5px solid rgba(255,255,255,.12);border-radius:var(--r2);padding:10px 12px;color:var(--t1);font-family:var(--sans);font-size:.88rem;height:44px;}
.fi:focus{outline:none;border-color:var(--gold);}
select.fi option{background:var(--card);}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{width:100%;padding:12px;border:none;border-radius:var(--r2);font-family:var(--sans);font-weight:800;font-size:.9rem;cursor:pointer;margin-bottom:8px;}
.btn-gold{background:linear-gradient(135deg,var(--gold),#b8932a);color:#000;}
.btn-teal{background:rgba(14,165,233,.15);border:1px solid rgba(14,165,233,.3);color:var(--teal);}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--t2);}
.badge{padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:800;text-transform:uppercase;}
.bg-green{background:rgba(34,197,94,.12);color:var(--green);}
.bg-gold{background:rgba(212,168,67,.12);color:var(--gold);}
.bg-red{background:rgba(239,68,68,.12);color:var(--red);}
.bg-teal{background:rgba(14,165,233,.12);color:var(--teal);}
.student-preview{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.82rem;}
.student-preview:last-child{border:none;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 20px;font-size:.82rem;font-weight:700;color:var(--t1);z-index:999;display:none;white-space:nowrap;}

.rc-grade-A1{background:#dcfce7;color:#14532d;font-weight:800;}
.rc-grade-B{background:#dbeafe;color:#1e3a8a;font-weight:700;}
.rc-grade-C{background:#fef9c3;color:#713f12;font-weight:700;}
.rc-grade-D{background:#fed7aa;color:#7c2d12;font-weight:700;}
.rc-grade-E{background:#fde8d8;color:#9a3412;}
.rc-grade-F{background:#fee2e2;color:#7f1d1d;font-weight:700;}

/* ── PRINT STYLES ─────────────────────────── */
@media print{
  body{background:#fff;padding:0;}
  .no-print{display:none!important;}
  .result-card{page-break-after:always;break-after:page;}
  .result-card:last-child{page-break-after:avoid;}
}

/* ── RESULT CARD STYLES (screen + print) ───── */
.result-card{
  background:#fff;color:#000;
  width:210mm;min-height:297mm;
  margin:0 auto 20px;
  padding:10mm 12mm;
  font-family:'Times New Roman',serif;
  font-size:11pt;
  border:1px solid #ccc;
  position:relative;
}
@media screen{
  .result-card{ max-width:100%; }
}
.rc-school-header{text-align:center;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:8px;}
.rc-school-logo{width:70px;height:70px;object-fit:contain;margin-bottom:4px;}
.rc-school-name{font-size:16pt;font-weight:bold;text-transform:uppercase;letter-spacing:.05em;}
.rc-school-addr{font-size:9pt;color:#444;margin-top:2px;}
.rc-school-motto{font-style:italic;font-size:9pt;color:#333;margin-top:2px;}
.rc-title{text-align:center;font-size:12pt;font-weight:bold;background:#f0f0f0;padding:4px;margin:6px 0;border:1px solid #aaa;text-transform:uppercase;letter-spacing:.1em;}
.rc-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #aaa;margin-bottom:8px;}
.rc-info-cell{padding:4px 8px;font-size:9.5pt;border-bottom:1px solid #ddd;}
.rc-info-cell:nth-child(odd){border-right:1px solid #ddd;background:#fafafa;}
.rc-info-cell span{font-weight:bold;}
.rc-scores-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:9.5pt;}
.rc-scores-table th{background:#1a1a2e;color:#fff;padding:5px 4px;text-align:center;font-size:8.5pt;}
.rc-scores-table th:first-child{text-align:left;padding-left:6px;}
.rc-scores-table td{padding:4px;border-bottom:1px solid #eee;text-align:center;}
.rc-scores-table td:first-child{text-align:left;padding-left:6px;}
.rc-scores-table tr:nth-child(even) td{background:#f9f9f9;}
.rc-grade-A1{color:#155724;font-weight:bold;}
.rc-grade-B{color:#0c4a6e;font-weight:bold;}
.rc-grade-C{color:#78350f;font-weight:bold;}
.rc-grade-D{color:#92400e;}
.rc-grade-E{color:#991b1b;}
.rc-grade-F{color:#7f1d1d;font-weight:bold;}
.rc-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #aaa;margin-bottom:8px;text-align:center;}
.rc-summary-cell{padding:5px;border-right:1px solid #ddd;font-size:9pt;}
.rc-summary-cell:last-child{border-right:none;}
.rc-summary-cell .val{font-size:13pt;font-weight:bold;}
.rc-summary-cell .lbl{font-size:7.5pt;color:#555;text-transform:uppercase;}
.rc-remarks-section{border:1px solid #aaa;padding:6px 8px;margin-bottom:6px;font-size:9.5pt;}
.rc-remarks-section .label{font-weight:bold;margin-bottom:3px;}
.rc-sig-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:8px;}
.rc-sig-box{text-align:center;font-size:8.5pt;}
.rc-sig-line{border-top:1px solid #000;margin-top:20px;padding-top:3px;}
.rc-footer{text-align:center;font-size:8pt;color:#666;border-top:1px solid #ddd;padding-top:4px;margin-top:6px;}
</style>
</head>
<body>

<!-- ── CONTROLS (no-print) ─────────────────────────────────── -->
<div class="no-print">
  <div class="top-bar">
    <a href="javascript:void(0)" onclick="goBack()">← Back</a>
    <h1>📄 Result Cards</h1>
  </div>

  <!-- STEP 1: SELECT -->
  <div class="card">
    <div class="card-title">Step 1 — Select Class & Term</div>
    <div class="fg">
      <label>Class</label>
      <select class="fi" id="cls-sel" onchange="onClassChange()">
        <option value="">— Select Class —</option>
      </select>
    </div>
    <div class="f2">
      <div class="fg">
        <label>Term</label>
        <select class="fi" id="term-sel" onchange="onClassChange()">
          <option>First Term</option>
          <option>Second Term</option>
          <option>Third Term</option>
        </select>
      </div>
      <div class="fg">
        <label>Session</label>
        <input class="fi" id="sess-in" value="2025/2026" onchange="onClassChange()"/>
      </div>
    </div>
    <div class="fg">
      <label>Next Term Begins</label>
      <input class="fi" id="next-term" placeholder="e.g. 15th September 2026"/>
    </div>
  </div>

  <!-- STEP 2: PREVIEW -->
  <div class="card" id="preview-card" style="display:none;">
    <div class="card-title" id="preview-title">Preview</div>
    <div id="preview-list"></div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
      <div style="flex:1;min-width:120px;">
        <label style="font-size:.68rem;color:var(--t3);display:block;margin-bottom:3px;">CA1 Max</label>
        <input class="fi" id="ca1-max" type="number" value="20" style="height:38px;"/>
      </div>
      <div style="flex:1;min-width:120px;">
        <label style="font-size:.68rem;color:var(--t3);display:block;margin-bottom:3px;">CA2 Max</label>
        <input class="fi" id="ca2-max" type="number" value="20" style="height:38px;"/>
      </div>
      <div style="flex:1;min-width:120px;">
        <label style="font-size:.68rem;color:var(--t3);display:block;margin-bottom:3px;">Exam Max</label>
        <input class="fi" id="exam-max" type="number" value="60" style="height:38px;"/>
      </div>
    </div>
  </div>

  <!-- STEP 3: GENERATE -->
  <div id="generate-section" style="display:none;">
    <button class="btn btn-gold" onclick="generateCards()">📄 Generate Report Cards</button>
    <button class="btn btn-teal" onclick="window.print()">🖨️ Print All Cards</button>
    <button class="btn btn-ghost" onclick="document.getElementById('cards-output').innerHTML='';document.getElementById('generate-section').style.display='none';">✕ Clear</button>
  </div>
</div>

<!-- ── CARDS OUTPUT ─────────────────────────────────────────── -->
<div id="cards-output"></div>

<div class="toast" id="rsms-toast"></div>

<script src="rsms-firebase.js"></script>
<script>
// ── SCOPED HELPERS ────────────────────────────────────────────
function _sid(){ return (JSON.parse(localStorage.getItem('rsms_school')||'{}')||{}).schoolId||''; }
function _key(k){ var id=_sid(); return id?'rsms_'+id+'_'+k:'rsms_'+k; }
function _lsget(k){ return localStorage.getItem(_key(k))||localStorage.getItem('rsms_'+k)||null; }
// ─────────────────────────────────────────────────────────────

// ── DATA ──────────────────────────────────────────────────────
var SCHOOL   = JSON.parse(localStorage.getItem('rsms_school')||'{"name":"School","principal":"","address":"","phone":"","motto":""}');
var STUDENTS = JSON.parse(_lsget('students')||'[]');
var LOGO     = localStorage.getItem('rsms_school_logo')||'';

var currentStudents = [];
var currentScores   = {}; // {stuId: {subject: {ca1,ca2,exam}}}
var currentSubjects = [];

// ── INIT ──────────────────────────────────────────────────────
window.addEventListener('load', function(){
  setTimeout(function(){
    try{
      var _sc=JSON.parse(localStorage.getItem('rsms_school')||'{}');
      if(_sc.schoolId&&typeof RSMS_FB!=='undefined'){
        if(RSMS_FB.isReady()){
          RSMS_FB.warmCache(_sc.schoolId, function(){
            // Refresh from SCOPED key after warm cache
            STUDENTS=JSON.parse(_lsget('students')||'[]');
            SCHOOL=JSON.parse(localStorage.getItem('rsms_school')||'{}');
            LOGO=localStorage.getItem('rsms_school_logo')||'';
            populateClassDropdown();
          });
        }
      }
    }catch(e){}
  },500);
  populateClassDropdown();
});

function populateClassDropdown(){
  var sel = document.getElementById('cls-sel');
  sel.innerHTML = '<option value="">— Select Class —</option>';

  // Get classes from actual students
  var classes = [];
  STUDENTS.forEach(function(s){
    if(s.class && classes.indexOf(s.class)<0) classes.push(s.class);
  });

  // Also get classes from rsms_scores_* keys (both scoped and unscoped)
  var sid=_sid();
  var scopedPrefix=sid?'rsms_'+sid+'_scores_':'';
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(!k) continue;
    var isScoped=scopedPrefix&&k.indexOf(scopedPrefix)===0;
    var isUnscoped=k.indexOf('rsms_scores_')===0;
    if(!isScoped&&!isUnscoped) continue;
    // Extract class name from key
    var stripped=isScoped?k.replace(scopedPrefix,''):k.replace('rsms_scores_','');
    var parts=stripped.split('_');
    if(parts.length>=3){
      // Score key format: CLASS_TERM_SESSION (all with _ replacing spaces)
      // Term is last 3 parts (e.g. First_Term or Second_Term)
      // Session is last part with _ (e.g. 2025_2026)
      // Class is everything before term
      // Term options: First_Term, Second_Term, Third_Term
      var termPatterns=['First_Term','Second_Term','Third_Term'];
      var termIdx=-1;
      for(var ti=0;ti<termPatterns.length;ti++){
        var tParts=termPatterns[ti].split('_');
        for(var pi=0;pi<parts.length-tParts.length;pi++){
          if(parts.slice(pi,pi+tParts.length).join('_')===termPatterns[ti]){
            termIdx=pi; break;
          }
        }
        if(termIdx>=0) break;
      }
      var clsName=termIdx>0?parts.slice(0,termIdx).join(' '):parts[0];
      if(clsName&&classes.indexOf(clsName)<0) classes.push(clsName);
    }
  }

  // Sort and add
  classes.sort();
  classes.forEach(function(c){
    var o=document.createElement('option');
    o.value=c; o.textContent=c; sel.appendChild(o);
  });

  if(!classes.length){
    toast('No classes found. Add students first.','info');
  }
}

function onClassChange(){
  var cls  = document.getElementById('cls-sel').value;
  var term = document.getElementById('term-sel').value;
  var sess = document.getElementById('sess-in').value||'2025/2026';
  if(!cls) return;

  loadScores(cls, term, sess);
}

// ── LOAD SCORES FROM ALL rsms_scores_* KEYS ──────────────────
function loadScores(cls, term, sess){
  currentStudents = STUDENTS.filter(function(s){
    return (s.class||'').trim().toLowerCase() === cls.trim().toLowerCase();
  });

  // Also include students found in scores even if not in rsms_students
  currentScores  = {};
  currentSubjects = [];

  var clsKey = cls.replace(/\s+/g,'_');
  var _schoolId=_sid();
  var _scopedPfx=_schoolId?'rsms_'+_schoolId+'_scores_':'';

  // Scan ALL score keys — both scoped and unscoped
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(!k) continue;
    var _isScoped=_scopedPfx&&k.indexOf(_scopedPfx)===0;
    var _isUnscoped=k.indexOf('rsms_scores_')===0;
    if(!_isScoped&&!_isUnscoped) continue;
    var _stripped=_isScoped?k.replace(_scopedPfx,''):k.replace('rsms_scores_','');
    if(_stripped.indexOf(clsKey)<0) continue;
    var data=JSON.parse(localStorage.getItem(k)||'{}');
    Object.keys(data).forEach(function(entryKey){
      var e=data[entryKey];
      if(!e||!e.stuId||!e.subject) return;
      var sid=e.stuId;
      var subj=e.subject;
      if(!currentScores[sid]) currentScores[sid]={};
      // Only overwrite if no score yet or new score has data
      if(!currentScores[sid][subj]||
        (parseInt(e.ca1||0)+parseInt(e.ca2||0)+parseInt(e.exam||0)>0)){
        currentScores[sid][subj]={
          ca1:parseInt(e.ca1||0),
          ca2:parseInt(e.ca2||0),
          exam:parseInt(e.exam||0)
        };
      }
      if(currentSubjects.indexOf(subj)<0) currentSubjects.push(subj);
      // Add student to list if not already there
      if(!currentStudents.find(function(s){return s.id===sid;})){
        // Look up from full student list
        var fullStu=STUDENTS.find(function(s){return s.id===sid;});
        if(fullStu) currentStudents.push(fullStu);
        else currentStudents.push({
          id:sid,surname:e.surname||'',firstname:e.firstname||'',
          class:cls,reg:e.reg||sid
        });
      }
    });
  }

  currentSubjects.sort();
  showPreview(cls, term, sess);
}

// ── PREVIEW ───────────────────────────────────────────────────
function showPreview(cls, term, sess){
  var previewCard=document.getElementById('preview-card');
  var previewList=document.getElementById('preview-list');
  var genSection=document.getElementById('generate-section');

  if(!currentStudents.length){
    previewCard.style.display='block';
    document.getElementById('preview-title').textContent=
      cls+' — No students found';
    previewList.innerHTML=
      '<div style="color:var(--t3);font-size:.82rem;padding:8px 0;">'+
      'No students or scores found for this class/term. '+
      'Make sure teachers have entered scores for '+term+' '+sess+'.</div>';
    genSection.style.display='none';
    return;
  }

  previewCard.style.display='block';
  document.getElementById('preview-title').textContent=
    cls+' — '+currentStudents.length+' students · '+currentSubjects.length+' subjects';

  previewList.innerHTML='';
  currentStudents.forEach(function(s){
    var name=(s.surname||'')+' '+(s.firstname||'');
    var scores=currentScores[s.id]||{};
    var subjectCount=Object.keys(scores).filter(function(subj){
      var sc=scores[subj];
      return sc&&(sc.ca1||sc.ca2||sc.exam);
    }).length;
    var total=Object.values(scores).reduce(function(a,sc){
      return a+(parseInt(sc.ca1||0)+parseInt(sc.ca2||0)+parseInt(sc.exam||0));
    },0);
    var row=document.createElement('div');
    row.className='student-preview';
    row.innerHTML=
      '<div>'+
        '<div style="font-weight:700;font-size:.85rem;">'+name+'</div>'+
        '<div style="font-size:.72rem;color:var(--t3);">'+s.reg+'</div>'+
      '</div>'+
      '<span class="badge '+(subjectCount>0?'bg-green':'bg-red')+'">'+
        subjectCount+' subject'+(subjectCount!==1?'s':'')+
      '</span>';
    previewList.appendChild(row);
  });

  genSection.style.display='block';
  toast('Loaded '+currentStudents.length+' students · '+currentSubjects.length+' subjects','success');
}

// ── GRADE HELPERS ─────────────────────────────────────────────

function getStudentPhoto(stuId){
  var p=localStorage.getItem('rsms_photo_'+stuId); if(p) return p;
  var students=JSON.parse(localStorage.getItem('rsms_students')||'[]');
  var stu=students.find(function(s){return s.id===stuId;});
  if(stu&&stu.passport) return stu.passport;
  if(stu&&stu.photo) return stu.photo;
  return null;
}

function grade(score){
  var s=parseFloat(score)||0;
  if(s>=75) return 'A1';
  if(s>=70) return 'B2';
  if(s>=65) return 'B3';
  if(s>=60) return 'C4';
  if(s>=55) return 'C5';
  if(s>=50) return 'C6';
  if(s>=45) return 'D7';
  if(s>=40) return 'E8';
  return 'F9';
}
function gradeRemark(g){
  return {A1:'Excellent',B2:'Very Good',B3:'Good',C4:'Credit',C5:'Credit',
    C6:'Credit',D7:'Pass',E8:'Pass',F9:'Fail'}[g]||'';
}
function gradeClass(g){
  if(g==='A1'||g==='B2'||g==='B3') return 'rc-grade-A1';
  if(g[0]==='C') return 'rc-grade-C';
  if(g==='D7'||g==='E8') return 'rc-grade-D';
  return 'rc-grade-F';
}
function ordinal(n){
  var s=['th','st','nd','rd'],v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
function goBack(){
  // 1. Check sessionStorage for the portal that opened this page
  var fromPortal=sessionStorage.getItem('rsms_result_from')||'';
  if(fromPortal){ location.href=fromPortal; return; }
  // 2. Check URL param ?from=
  var params=new URLSearchParams(window.location.search);
  var fromParam=params.get('from');
  if(fromParam){ location.href=fromParam+'.html'; return; }
  // 3. Check referrer
  var ref=document.referrer||'';
  var portals={
    'rsms-admin':'rsms-admin.html','rsms-classteacher':'rsms-classteacher.html',
    'rsms-teacher':'rsms-teacher.html','rsms-hod':'rsms-hod.html',
    'rsms-vp':'rsms-vp.html','rsms-principal':'rsms-principal.html',
    'rsms-student':'rsms-student.html','rsms-parent':'rsms-parent.html'
  };
  for(var key in portals){ if(ref.indexOf(key)>=0){ location.href=portals[key]; return; } }
  // 4. Fall back to user role
  var user=JSON.parse(sessionStorage.getItem('rsms_user')||'{}');
  var roleMap={admin:'rsms-admin.html',classteacher:'rsms-classteacher.html',
    teacher:'rsms-teacher.html',hod:'rsms-hod.html',vp:'rsms-vp.html',
    principal:'rsms-principal.html',student:'rsms-student.html',parent:'rsms-parent.html'};
  var role=(user.role||'').toLowerCase();
  if(roleMap[role]){ location.href=roleMap[role]; return; }
  history.back();
}

// ── GENERATE CARDS ────────────────────────────────────────────
function generateCards(){
  var cls     = document.getElementById('cls-sel').value;
  var term    = document.getElementById('term-sel').value;
  var sess    = document.getElementById('sess-in').value||'2025/2026';
  var nextTerm= document.getElementById('next-term').value||'To be announced';
  var ca1Max  = parseInt(document.getElementById('ca1-max').value)||20;
  var ca2Max  = parseInt(document.getElementById('ca2-max').value)||20;
  var examMax = parseInt(document.getElementById('exam-max').value)||60;
  var totalMax= ca1Max+ca2Max+examMax;

  if(!cls){toast('Select a class first','error');return;}
  if(!currentStudents.length){toast('No students loaded','error');return;}

  var ctRemarksAll  = JSON.parse(_lsget('ct_remarks')||'{}');
  var principalAll  = JSON.parse(_lsget('principal_remarks')||'{}');
  var pubResults    = JSON.parse(_lsget('published_results')||'{}');

  // ── Calculate cumulative (auto) ──────────────────────────
  function getCumulative(stuId,subj,currentTerm){
    // Read previous term scores
    var termOrder=['First Term','Second Term','Third Term'];
    var tIdx=termOrder.indexOf(currentTerm);
    if(tIdx<=0) return null;
    var prevTerm=termOrder[tIdx-1];
    // Find prev term scoped key
    var sid2=_sid();
    var prevKey=(sid2?'rsms_'+sid2+'_scores_':'rsms_scores_')+
      cls.replace(/\s+/g,'_')+'_'+prevTerm.replace(/\s+/g,'_')+'_'+sess.replace('/','_');
    var prevUnscoped='rsms_scores_'+cls.replace(/\s+/g,'_')+'_'+prevTerm.replace(/\s+/g,'_')+'_'+sess.replace('/','_');
    var prevScores=JSON.parse(localStorage.getItem(prevKey)||localStorage.getItem(prevUnscoped)||'{}');
    var prevEntry=Object.values(prevScores).find(function(e){ return e&&e.stuId===stuId&&e.subject===subj; });
    if(!prevEntry) return null;
    var prevTotal=parseInt(prevEntry.ca1||0)+parseInt(prevEntry.ca2||0)+parseInt(prevEntry.exam||0);
    return prevTotal;
  }

  // ── Sort for positions ──────────────────────────────────
  var studentTotals=currentStudents.map(function(s){
    var scores=currentScores[s.id]||{};
    var total=0; var subjCount=0;
    currentSubjects.forEach(function(subj){
      var sc=scores[subj];
      if(sc){ total+=parseInt(sc.ca1||0)+parseInt(sc.ca2||0)+parseInt(sc.exam||0); subjCount++; }
    });
    return {id:s.id,total:total,subjCount:subjCount};
  });
  var sorted=[].concat(studentTotals).sort(function(a,b){return b.total-a.total;});
  var positions={};
  sorted.forEach(function(s,i){ positions[s.id]=i+1; });

  var output=document.getElementById('cards-output');
  output.innerHTML='';

  currentStudents.forEach(function(stu){
    var name=(stu.surname||'').toUpperCase()+' '+(stu.firstname||'');
    var scores=currentScores[stu.id]||{};
    var stuTotals=studentTotals.find(function(s){return s.id===stu.id;})||{total:0,subjCount:0};
    var pos=positions[stu.id]||'-';
    var grandTotal=stuTotals.total;
    var subjCount=stuTotals.subjCount;
    var avg=subjCount?Math.round(grandTotal/subjCount):0;

    // CT remark (keyed by stuId_term_sess)
    var ctKey=stu.id+'_'+term.replace(/\s+/g,'_')+'_'+sess.replace('/','_');
    var ctData=ctRemarksAll[ctKey]||ctRemarksAll[stu.id]||{};
    var ctComment=ctData.comment||ctData||'';
    if(typeof ctComment==='object') ctComment='';
    var ctConduct=ctData.conduct||'';
    var ctInterest=ctData.interest||'';
    var ctActivities=ctData.activities||'';
    var ctAffective=ctData.affective||{};
    var ctPsychomotor=ctData.psychomotor||{};
    var principalRemark=principalAll[stu.id]||'';

    // Build subject rows with cumulative
    var subjectRows='';
    var termOrder2=['First Term','Second Term','Third Term'];
    var tIdx2=termOrder2.indexOf(term);
    var showCumulative=tIdx2>0;

    var subjWithScores=currentSubjects.filter(function(subj){
      var sc=scores[subj];
      return sc&&(parseInt(sc.ca1||0)+parseInt(sc.ca2||0)+parseInt(sc.exam||0)>0);
    });

    var grandTotalWithCum=0;
    subjWithScores.forEach(function(subj,idx){
      var sc=scores[subj]||{ca1:0,ca2:0,exam:0};
      var ca1=parseInt(sc.ca1||0),ca2=parseInt(sc.ca2||0),exam=parseInt(sc.exam||0);
      var tot=ca1+ca2+exam;
      var cum=showCumulative?getCumulative(stu.id,subj,term):null;
      var grandTot=showCumulative&&cum!==null?Math.round((tot+cum)/2):tot;
      grandTotalWithCum+=grandTot;
      var g=grade(grandTot);
      var rem=gradeRemark(g);
      var gc=gradeClass(g);
      subjectRows+=
        '<tr>'+
          '<td style="text-align:left;padding:3px 5px;font-size:8.5pt;">'+(idx+1)+'. '+subj+'</td>'+
          '<td style="text-align:center;font-size:8.5pt;">'+ca1+'</td>'+
          '<td style="text-align:center;font-size:8.5pt;">'+ca2+'</td>'+
          '<td style="text-align:center;font-size:8.5pt;">'+exam+'</td>'+
          '<td style="text-align:center;font-weight:700;font-size:8.5pt;">'+tot+'</td>'+
          (showCumulative?'<td style="text-align:center;font-size:8.5pt;color:#555;">'+(cum!==null?cum:'—')+'</td>':'') +
          (showCumulative?'<td style="text-align:center;font-weight:700;font-size:8.5pt;background:#fef9ee;">'+grandTot+'</td>':'') +
          '<td style="text-align:center;font-size:8pt;font-weight:800;" class="'+gc+'">'+g+'</td>'+
          '<td style="text-align:center;font-size:7.5pt;">'+rem+'</td>'+
        '</tr>';
    });

    var finalAvg=subjCount?Math.round(grandTotalWithCum/subjCount):avg;
    var finalGrade=grade(finalAvg);

    // Affective traits
    var affTraits=['Punctuality','Neatness','Attentiveness','Cooperation','Honesty','Respect'];
    var affRows='';
    affTraits.forEach(function(t,i){
      var val=ctAffective[t]||'5';
      var ratings=['','★','★★','★★★','★★★★','★★★★★'];
      var ratingLabels={'5':'Excellent','4':'Good','3':'Fair','2':'Poor','1':'Unsatisfactory'};
      if(i%3===0) affRows+='<tr>';
      affRows+='<td style="border:1px solid #ddd;padding:3px 5px;font-size:8pt;">'+t+'</td>'+
               '<td style="border:1px solid #ddd;padding:3px 5px;text-align:center;font-size:8pt;color:#d4a843;">'+
               (ratings[val]||ratings[5])+'</td>'+
               '<td style="border:1px solid #ddd;padding:3px 5px;font-size:7.5pt;color:#555;">'+(ratingLabels[val]||'Excellent')+'</td>';
      if(i%3===2||i===affTraits.length-1) affRows+='</tr>';
    });

    // Psychomotor traits
    var psyTraits=['Handwriting','Drawing/Art','Sports/P.E','Computer Skills','Music/Drama','Spoken English'];
    var psyRows='';
    psyTraits.forEach(function(t,i){
      var rawKey=t.replace(/[\/\. ]/g,'').toLowerCase();
      var val=ctPsychomotor[t]||'5';
      var ratings=['','★','★★','★★★','★★★★','★★★★★'];
      var ratingLabels={'5':'Excellent','4':'Good','3':'Fair','2':'Poor','1':'Unsatisfactory'};
      if(i%3===0) psyRows+='<tr>';
      psyRows+='<td style="border:1px solid #ddd;padding:3px 5px;font-size:8pt;">'+t+'</td>'+
               '<td style="border:1px solid #ddd;padding:3px 5px;text-align:center;font-size:8pt;color:#0ea5e9;">'+
               (ratings[val]||ratings[5])+'</td>'+
               '<td style="border:1px solid #ddd;padding:3px 5px;font-size:7.5pt;color:#555;">'+(ratingLabels[val]||'Excellent')+'</td>';
      if(i%3===2||i===psyTraits.length-1) psyRows+='</tr>';
    });

    var logoHtml=LOGO?'<img src="'+LOGO+'" style="width:70px;height:70px;object-fit:contain;" onerror="this.style.display='none'"/>':'';
    var phHtml=(function(){
      var ph=getStudentPhoto(stu.id);
      return ph
        ? '<img src="'+ph+'" style="width:75px;height:90px;object-fit:cover;border:1px solid #aaa;display:block;"/>'
        : '<div style="width:75px;height:90px;border:1px dashed #bbb;display:flex;align-items:center;justify-content:center;font-size:6.5pt;color:#aaa;text-align:center;background:#fafafa;">Passport Photo</div>';
    })();

    var termOrder3=['First Term','Second Term','Third Term'];
    var showCum=termOrder3.indexOf(term)>0;

    var card=document.createElement('div');
    card.className='result-card';
    card.style.cssText='background:#fff;border:1px solid #ccc;font-family:Arial,sans-serif;'+
      'width:210mm;min-height:297mm;margin:0 auto 20px;padding:10mm;box-sizing:border-box;'+
      'color:#111;position:relative;';

    card.innerHTML=
      // ── SCHOOL HEADER ──────────────────────────────────
      '<div style="border-bottom:3px solid #1a0a3e;padding-bottom:8px;margin-bottom:8px;'+
        'display:flex;align-items:center;gap:12px;">'+
        '<div>'+logoHtml+'</div>'+
        '<div style="flex:1;text-align:center;">'+
          '<div style="font-size:17pt;font-weight:900;color:#1a0a3e;letter-spacing:.5px;line-height:1.2;">'+SCHOOL.name+'</div>'+
          (SCHOOL.address?'<div style="font-size:8.5pt;color:#555;margin-top:2px;">'+SCHOOL.address+'</div>':'')+
          (SCHOOL.phone?'<div style="font-size:8.5pt;color:#555;">Tel: '+SCHOOL.phone+'</div>':'')+
          (SCHOOL.motto?'<div style="font-size:8pt;color:#1a0a3e;font-style:italic;margin-top:2px;">Motto: '+SCHOOL.motto+'</div>':'')+
        '</div>'+
        '<div>'+phHtml+'</div>'+
      '</div>'+

      // ── REPORT TITLE ────────────────────────────────────
      '<div style="text-align:center;background:#1a0a3e;color:#fff;padding:5px;margin-bottom:8px;'+
        'font-size:11pt;font-weight:800;letter-spacing:1px;">'+
        'STUDENT ACADEMIC REPORT — '+term.toUpperCase()+' '+sess+
      '</div>'+

      // ── STUDENT BIO ─────────────────────────────────────
      '<table style="width:100%;border-collapse:collapse;font-size:8.8pt;margin-bottom:8px;border:1px solid #bbb;">'+
        '<tr>'+
          '<td style="background:#1a0a3e;color:#fff;padding:4px 8px;font-weight:700;width:20%;">Student Name</td>'+
          '<td style="padding:4px 8px;border:1px solid #ddd;font-weight:700;width:30%;">'+name+'</td>'+
          '<td style="background:#1a0a3e;color:#fff;padding:4px 8px;font-weight:700;width:15%;">Reg No.</td>'+
          '<td style="padding:4px 8px;border:1px solid #ddd;width:35%;">'+(stu.reg||stu.id)+'</td>'+
        '</tr>'+
        '<tr>'+
          '<td style="background:#f0f0f0;padding:4px 8px;font-weight:700;">Class</td>'+
          '<td style="padding:4px 8px;border:1px solid #ddd;font-weight:700;">'+cls+'</td>'+
          '<td style="background:#f0f0f0;padding:4px 8px;font-weight:700;">Gender</td>'+
          '<td style="padding:4px 8px;border:1px solid #ddd;">'+(stu.gender||'—')+'</td>'+
        '</tr>'+
        '<tr>'+
          '<td style="background:#1a0a3e;color:#fff;padding:4px 8px;font-weight:700;">Position</td>'+
          '<td style="padding:4px 8px;border:1px solid #ddd;font-weight:700;color:#1a0a3e;">'+ordinal(pos)+' / '+currentStudents.length+'</td>'+
          '<td style="background:#1a0a3e;color:#fff;padding:4px 8px;font-weight:700;">Date</td>'+
          '<td style="padding:4px 8px;border:1px solid #ddd;">'+new Date().toLocaleDateString()+'</td>'+
        '</tr>'+
      '</table>'+

      // ── COGNITIVE DOMAIN (Academic Scores) ──────────────
      '<div style="font-size:9.5pt;font-weight:800;color:#1a0a3e;background:#eef2ff;'+
        'padding:4px 8px;border-left:4px solid #1a0a3e;margin-bottom:4px;">'+
        'A. COGNITIVE DOMAIN — ACADEMIC PERFORMANCE'+
      '</div>'+
      '<table style="width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:8px;">'+
        '<thead>'+
          '<tr style="background:#1a0a3e;color:#fff;">'+
            '<th style="padding:4px 5px;text-align:left;border:1px solid #aaa;">S/N</th>'+
            '<th style="padding:4px 5px;text-align:left;border:1px solid #aaa;">Subject</th>'+
            '<th style="padding:4px 5px;text-align:center;border:1px solid #aaa;">CA1<br/>/'+ca1Max+'</th>'+
            '<th style="padding:4px 5px;text-align:center;border:1px solid #aaa;">CA2<br/>/'+ca2Max+'</th>'+
            '<th style="padding:4px 5px;text-align:center;border:1px solid #aaa;">Exam<br/>/'+examMax+'</th>'+
            '<th style="padding:4px 5px;text-align:center;border:1px solid #aaa;font-weight:800;">Total<br/>/'+totalMax+'</th>'+
            (showCum?'<th style="padding:4px 5px;text-align:center;border:1px solid #aaa;background:#fef9ee;">Prev<br/>Term</th>':'') +
            (showCum?'<th style="padding:4px 5px;text-align:center;border:1px solid #aaa;background:#fef9ee;font-weight:800;">Grand<br/>Total</th>':'') +
            '<th style="padding:4px 5px;text-align:center;border:1px solid #aaa;background:#d4a843;color:#000;">Grade</th>'+
            '<th style="padding:4px 5px;text-align:center;border:1px solid #aaa;">Remark</th>'+
          '</tr>'+
        '</thead>'+
        '<tbody>'+subjectRows+'</tbody>'+
        '<tfoot>'+
          '<tr style="background:#f5f5f5;font-weight:800;font-size:8.5pt;">'+
            '<td colspan="5" style="padding:4px 8px;border:1px solid #bbb;text-align:right;">Total / Average:</td>'+
            '<td style="padding:4px 8px;border:1px solid #bbb;text-align:center;">'+grandTotal+'</td>'+
            (showCum?'<td style="border:1px solid #bbb;"></td>':'') +
            (showCum?'<td style="padding:4px 8px;border:1px solid #bbb;text-align:center;background:#fef9ee;">'+grandTotalWithCum+'</td>':'') +
            '<td style="padding:4px 8px;border:1px solid #bbb;text-align:center;color:#1a0a3e;">'+finalGrade+'</td>'+
            '<td style="padding:4px 8px;border:1px solid #bbb;text-align:center;color:#1a0a3e;">'+finalAvg+'%</td>'+
          '</tr>'+
        '</tfoot>'+
      '</table>'+

      // ── GRADE KEY ────────────────────────────────────────
      '<div style="font-size:7pt;color:#555;margin-bottom:8px;display:flex;gap:4px;flex-wrap:wrap;">'+
        '<b>Grade Key:</b> A1(75-100)=Excellent &nbsp;|&nbsp; B2(70-74)=V.Good &nbsp;|&nbsp; B3(65-69)=Good &nbsp;|&nbsp; '+
        'C4(60-64)=Credit &nbsp;|&nbsp; C5(55-59)=Credit &nbsp;|&nbsp; C6(50-54)=Credit &nbsp;|&nbsp; '+
        'D7(45-49)=Pass &nbsp;|&nbsp; E8(40-44)=Pass &nbsp;|&nbsp; F9(0-39)=Fail'+
      '</div>'+

      // ── AFFECTIVE + PSYCHOMOTOR ───────────────────────────
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">'+

        // Affective
        '<div>'+
          '<div style="font-size:9.5pt;font-weight:800;color:#1a0a3e;background:#eef2ff;'+
            'padding:4px 8px;border-left:4px solid #22c55e;margin-bottom:4px;">'+
            'B. AFFECTIVE DOMAIN'+
          '</div>'+
          '<table style="width:100%;border-collapse:collapse;font-size:7.5pt;">'+
            '<thead><tr style="background:#22c55e;color:#fff;">'+
              '<th style="padding:3px 5px;text-align:left;border:1px solid #aaa;">Trait</th>'+
              '<th style="padding:3px 5px;text-align:center;border:1px solid #aaa;">Rating</th>'+
              '<th style="padding:3px 5px;text-align:center;border:1px solid #aaa;">Grade</th>'+
            '</tr></thead>'+
            '<tbody>'+affRows+'</tbody>'+
          '</table>'+
          '<div style="font-size:6.5pt;color:#777;margin-top:2px;">5=Excellent 4=Good 3=Fair 2=Poor 1=Unsatisfactory</div>'+
        '</div>'+

        // Psychomotor
        '<div>'+
          '<div style="font-size:9.5pt;font-weight:800;color:#1a0a3e;background:#eef2ff;'+
            'padding:4px 8px;border-left:4px solid #0ea5e9;margin-bottom:4px;">'+
            'C. PSYCHOMOTOR DOMAIN'+
          '</div>'+
          '<table style="width:100%;border-collapse:collapse;font-size:7.5pt;">'+
            '<thead><tr style="background:#0ea5e9;color:#fff;">'+
              '<th style="padding:3px 5px;text-align:left;border:1px solid #aaa;">Skill</th>'+
              '<th style="padding:3px 5px;text-align:center;border:1px solid #aaa;">Rating</th>'+
              '<th style="padding:3px 5px;text-align:center;border:1px solid #aaa;">Grade</th>'+
            '</tr></thead>'+
            '<tbody>'+psyRows+'</tbody>'+
          '</table>'+
          '<div style="font-size:6.5pt;color:#777;margin-top:2px;">5=Excellent 4=Good 3=Fair 2=Poor 1=Unsatisfactory</div>'+
        '</div>'+

      '</div>'+

      // ── ACTIVITIES + CONDUCT ─────────────────────────────
      '<table style="width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:8px;border:1px solid #ddd;">'+
        '<tr>'+
          '<td style="background:#f0f0f0;padding:4px 8px;font-weight:700;width:25%;">Activities</td>'+
          '<td style="padding:4px 8px;border-left:1px solid #ddd;width:35%;">'+(ctActivities||'—')+'</td>'+
          '<td style="background:#f0f0f0;padding:4px 8px;font-weight:700;width:15%;">Conduct</td>'+
          '<td style="padding:4px 8px;border-left:1px solid #ddd;width:25%;">'+(ctConduct||'—')+'</td>'+
        '</tr>'+
        '<tr>'+
          '<td style="background:#f0f0f0;padding:4px 8px;font-weight:700;">Interest</td>'+
          '<td style="padding:4px 8px;border:1px solid #ddd;">'+(ctInterest||'—')+'</td>'+
          '<td style="background:#f0f0f0;padding:4px 8px;font-weight:700;">Average</td>'+
          '<td style="padding:4px 8px;border-left:1px solid #ddd;font-weight:800;color:#1a0a3e;">'+finalAvg+'% ('+finalGrade+')</td>'+
        '</tr>'+
      '</table>'+

      // ── REMARKS ─────────────────────────────────────────
      '<table style="width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:8px;border:1px solid #ddd;">'+
        '<tr>'+
          '<td style="background:#1a0a3e;color:#fff;padding:4px 8px;font-weight:700;width:28%;white-space:nowrap;">Class Teacher's Comment</td>'+
          '<td style="padding:5px 8px;border-left:1px solid #ddd;min-height:22px;">'+(ctComment||'&nbsp;')+'</td>'+
        '</tr>'+
        '<tr>'+
          '<td style="background:#1a0a3e;color:#fff;padding:4px 8px;font-weight:700;white-space:nowrap;">Principal's Remark</td>'+
          '<td style="padding:5px 8px;border-left:1px solid #ddd;min-height:22px;">'+(principalRemark||'&nbsp;')+'</td>'+
        '</tr>'+
      '</table>'+

      // ── NEXT TERM + SIGNATURES ───────────────────────────
      '<div style="display:flex;align-items:center;justify-content:space-between;'+
        'border:1px solid #ddd;padding:6px 10px;font-size:8.5pt;margin-bottom:8px;">'+
        '<div><b>Next Term Begins:</b> '+nextTerm+'</div>'+
        '<div><b>Session:</b> '+sess+'</div>'+
        '<div><b>No. in Class:</b> '+currentStudents.length+'</div>'+
      '</div>'+

      '<table style="width:100%;border-collapse:collapse;font-size:8.5pt;border:1px solid #ddd;">'+
        '<tr>'+
          '<td style="padding:6px 10px;border-right:1px solid #ddd;text-align:center;width:33%;">'+
            '<div style="border-top:1px solid #aaa;margin-top:30px;padding-top:4px;font-size:7.5pt;">'+
            'Class Teacher's Signature & Date</div>'+
          '</td>'+
          '<td style="padding:6px 10px;border-right:1px solid #ddd;text-align:center;width:33%;">'+
            '<div style="border-top:1px solid #aaa;margin-top:30px;padding-top:4px;font-size:7.5pt;">'+
            'HOD's Signature & Date</div>'+
          '</td>'+
          '<td style="padding:6px 10px;text-align:center;width:34%;">'+
            '<div style="border-top:1px solid #aaa;margin-top:30px;padding-top:4px;font-size:7.5pt;">'+
            (SCHOOL.principal?SCHOOL.principal+' (Principal)':'Principal's Signature & Date')+
            '</div>'+
          '</td>'+
        '</tr>'+
      '</table>'+

      // ── FOOTER ───────────────────────────────────────────
      '<div style="text-align:center;font-size:7pt;color:#aaa;margin-top:6px;border-top:1px solid #eee;padding-top:4px;">'+
        SCHOOL.name+' | Powered by RSMS — Rehoteq Technologies | rsms.rehoteq.com'+
      '</div>';

    output.appendChild(card);
  });

  toast('Generated '+currentStudents.length+' report cards ✅','success');
  setTimeout(function(){ output.scrollIntoView({behavior:'smooth'}); },300);
}


// ── TOAST ─────────────────────────────────────────────────────
function toast(msg,type){
  var el=document.getElementById('rsms-toast'); if(!el)return;
  el.textContent=msg;
  el.style.display='block';
  el.style.borderColor=type==='success'?'rgba(34,197,94,.4)':
    type==='error'?'rgba(239,68,68,.4)':'rgba(255,255,255,.15)';
  setTimeout(function(){el.style.display='none';},3000);
}
</script>
